name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Install Cyrius toolchain
        # See ci.yml for the full rationale. Short version: do NOT hand-roll
        # this by untarring the release asset into $HOME/.cyrius/{bin,lib} —
        # that is the pre-6.5 layout, and from 6.5.x `cyrius deps` resolves the
        # stdlib snapshot from $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and
        # hard-fails when only the flattened dirs exist. The upstream installer
        # lays out versions/<v>/{bin,lib}, symlinks bin/ + lib/ at it, and
        # verifies SHA256 + signature. The cyrius.cyml pin stays the single
        # source of truth for the version.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Build
        # Binary is `cmdrs`, not the repo name — see ci.yml for the rationale.
        run: |
          cyrius deps
          mkdir -p build
          cyrius build src/main.cyr build/cmdrs

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: build/*
