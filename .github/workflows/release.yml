name: Release

on:
  push:
    tags: ['[0-9]*']

# Audit 2026-08-26, A-09: least privilege. `contents: write` used to sit at the
# WORKFLOW level, so the CI-gate job inherited it — a job that builds, runs the
# suite, and pipes a remote installer to sh had a token that could push to the
# repo, for no reason. The write scope now belongs to the release job alone.
permissions:
  contents: read

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  release:
    name: Build & Release
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # `persist-credentials: false` matters most here. checkout writes the token to
      # .git/config by default, and this job then runs a remote installer and compiles,
      # so with the default the write scope would reach every one of those steps.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Verify version
        run: |
          FILE_VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG_VERSION="${GITHUB_REF_NAME}"
          test "$FILE_VERSION" = "$TAG_VERSION" || { echo "VERSION ($FILE_VERSION) != tag ($TAG_VERSION)"; exit 1; }

      - name: Install Cyrius toolchain
        # See the script for why it is shaped as it is. This job holds `contents:
        # write`, so it is the one that most needs the pin checked.
        run: scripts/install-toolchain.sh

      - name: Verify lib/ and the lock regenerate from the pins
        # This job builds the binary users download, and the CI gate's build does not
        # carry over, so it gets its own check.
        run: scripts/lock-check.sh

      - name: Build
        # Binary is `cmdrs`, not the repo name — see ci.yml for the rationale.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/cmdrs

      - name: Checksum
        # GitHub's asset digest is only visible through the API. This one travels
        # with the binary. The build is reproducible, so it can also be checked by
        # rebuilding from the tag.
        run: (cd build && sha256sum cmdrs > SHA256SUMS)

      - name: Create release
        # Audit 2026-08-26, A-10: pinned by commit SHA, not the mutable `v2`
        # tag. This is the one step handed the `contents: write` token, so a
        # retagged `v2` would run new third-party code against it. SHA is
        # v2 as resolved 2026-08-26; bump deliberately, not implicitly.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: build/*
