name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # The cyrius.cyml `[package].cyrius` pin is the single source of truth
        # for the toolchain version (CLAUDE.md "no hardcoded toolchain versions
        # in CI YAML") — read the pin and hand it to the upstream installer.
        #
        # Do NOT hand-roll this by untarring the release asset into
        # $HOME/.cyrius/{bin,lib}: that is the pre-6.5 layout. From 6.5.x
        # `cyrius deps` resolves the stdlib snapshot from
        # $HOME/.cyrius/versions/$CYRIUS_VERSION/lib and hard-fails with
        # "cyrius.cyml pins version X but it is not installed at ... expected:
        # ~/.cyrius/versions/<ver>/lib/" if only the flattened dirs exist. The
        # installer lays out versions/<v>/{bin,lib} and symlinks bin/ + lib/ at
        # it, and additionally does SHA256 + signature verification the
        # hand-rolled block skipped. Same pattern as darshana / patra / libro.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain layout
        # Guards the exact failure this replaced: a successful-looking install
        # that leaves no versions/<v>/lib snapshot, so every later cyrius
        # invocation dies on dep resolution instead of here.
        run: |
          set -e
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          test -d "$HOME/.cyrius/versions/$CYRIUS_VERSION/lib" \
            || { echo "::error::stdlib snapshot missing at ~/.cyrius/versions/$CYRIUS_VERSION/lib"; exit 1; }
          cyrius version
          echo "toolchain ok: pin $CYRIUS_VERSION, snapshot present"

      - name: Resolve dependencies
        # Resolves the declared stdlib surface plus [deps.cmdit] (1.1.5, ADR
        # 0008) — commandress's one first-party AGNOS source dep, git-cloned at
        # its tag and vendored into lib/. This step needs network access for
        # that clone. The vendored stdlib snapshot itself is refreshed by
        # `cyrius lib sync --full` at release time, not here.
        run: cyrius deps

      - name: Verify the lock is honest
        # cyrius.lock is committed. A `path = "../cmdit"` override silently beats
        # its tag, and a lock generated with one active drops the dep's `commit`
        # pin line ENTIRELY — verified, not assumed — so CI, which has no sibling
        # checkouts, is where that shows up.
        #
        # The comparison lives in a script because the first version of this step
        # was an inline `git diff --exit-code -- cyrius.lock` and it false-
        # positived on its first run: `cyrius deps` does not emit lock entries in
        # a stable order across machines. See the header of lock-check.sh.
        run: scripts/lock-check.sh

      - name: Build
        # Binary is `cmdrs` (short for commandress), set via [build].output
        # in cyrius.cyml. We pass it explicitly here because the repo name
        # ("commandress") differs from the binary name.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/cmdrs

      - name: Test
        # Explicit .tcyr path (matches darshana + patra + mihi/iam/chakshu) —
        # the version-stable form. Bare `cyrius test` and the `cyrius tests`
        # discovery subcommand both rely on auto-discovery whose behaviour and
        # availability have varied across cyrius releases; the documented
        # `cyrius test <file.tcyr>` form sidesteps that surface entirely and
        # has worked on every pin this repo has carried.
        run: cyrius test tests/commandress.tcyr

      - name: Cold-start budget gate (≤ 5 ms)
        # `cyrius bench` runs the full bench suite; the gate script
        # greps for the `render_prompt` line, normalises its avg to
        # µs, and fails CI if it exceeds 5000 µs (the budget set by
        # architecture/001-prompt-render-budget.md). Override with
        # `BUDGET_US` if a tighter / looser bound is wanted locally.
        # Bench timings on CI runners are slower than dev hardware —
        # 5 ms keeps headroom over the typical ~10 µs measured locally.
        run: cyrius bench tests/commandress.bcyr | scripts/bench-gate.sh
