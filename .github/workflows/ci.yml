name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep 'cyrius *= *"' cyrius.cyml 2>/dev/null | head -1 | sed 's/.*"\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sLO "https://github.com/MacCracken/cyrius/releases/download/$CYRIUS_VERSION/cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          tar xzf "cyrius-$CYRIUS_VERSION-x86_64-linux.tar.gz"
          CYRIUS_DIR="cyrius-$CYRIUS_VERSION-x86_64-linux"
          mkdir -p "$HOME/.cyrius/bin" "$HOME/.cyrius/lib"
          cp "$CYRIUS_DIR/bin/"* "$HOME/.cyrius/bin/" 2>/dev/null || true
          cp -r "$CYRIUS_DIR/lib/"* "$HOME/.cyrius/lib/" 2>/dev/null || true
          chmod +x "$HOME/.cyrius/bin/"* 2>/dev/null || true
          echo "$HOME/.cyrius/bin" >> $GITHUB_PATH
          echo "CYRIUS_HOME=$HOME/.cyrius" >> $GITHUB_ENV

      - name: Resolve dependencies
        run: cyrius deps

      - name: Build
        # Binary is `cmdrs` (short for commandress), set via [build].output
        # in cyrius.cyml. We pass it explicitly here because the repo name
        # ("commandress") differs from the binary name.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/cmdrs

      - name: Test
        # Explicit .tcyr path (matches patra + mihi/iam/chakshu) — the version-
        # stable form across the 6.0.x line. Bare `cyrius test` stopped auto-
        # discovering .tcyr (fails "No .tcyr files"), and the `cyrius tests`
        # discovery subcommand only exists in cyrius AFTER 6.0.56 (the pin) — so
        # the CI's pinned toolchain rejects it ("Unknown command"). `cyrius test
        # <file.tcyr>` works on every 6.0.x.
        run: cyrius test tests/commandress.tcyr

      - name: Cold-start budget gate (≤ 5 ms)
        # `cyrius bench` runs the full bench suite; the gate script
        # greps for the `render_prompt` line, normalises its avg to
        # µs, and fails CI if it exceeds 5000 µs (the budget set by
        # architecture/001-prompt-render-budget.md). Override with
        # `BUDGET_US` if a tighter / looser bound is wanted locally.
        # Bench timings on CI runners are slower than dev hardware —
        # 5 ms keeps headroom over the typical ~10 µs measured locally.
        run: cyrius bench tests/commandress.bcyr | scripts/bench-gate.sh
