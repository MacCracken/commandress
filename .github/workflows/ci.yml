name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Without this block a direct run takes the repository's default token scope.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, because a tag can be moved. `persist-credentials: false`
      # keeps the token out of .git/config, where every later step could read it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        # The script reads the pin in cyrius.cyml and says why it is shaped as it is.
        run: scripts/install-toolchain.sh

      - name: Verify lib/ and the lock regenerate from the pins
        # Works on HEAD in a throwaway worktree, so it does not matter what ran
        # before it. See the header of lock-check.sh and architecture/003.
        run: scripts/lock-check.sh

      - name: Build
        # Binary is `cmdrs` (short for commandress), set via [build].output
        # in cyrius.cyml. We pass it explicitly here because the repo name
        # ("commandress") differs from the binary name.
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/cmdrs

      - name: Test
        # Explicit .tcyr path (matches darshana + patra + mihi/iam/chakshu) —
        # the version-stable form. Bare `cyrius test` and the `cyrius tests`
        # discovery subcommand both rely on auto-discovery whose behaviour and
        # availability have varied across cyrius releases; the documented
        # `cyrius test <file.tcyr>` form sidesteps that surface entirely and
        # has worked on every pin this repo has carried.
        #
        # CYRIUS_DCE=1 because `cyrius test` does not apply the manifest's
        # `[build] dce`. Without it the suite would exercise different code from the
        # binary that ships, so a DCE miscompile could not show up here. ADR 0010.
        run: CYRIUS_DCE=1 cyrius test tests/commandress.tcyr

      - name: Run the shipped binary
        # The suite never runs src/main.cyr. This does, and it is the only step that
        # measures a real cold start. See the header of smoke.sh.
        run: scripts/smoke.sh build/cmdrs

      - name: Prove the adapters treat the prompt as data
        # zsh is not on the runner image, and a missing shell fails the check.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends zsh
          scripts/adapter-check.sh build/cmdrs

      - name: Build for agnos
        # This target has no runner here, so compiling it is the check. It has broken
        # before on names that exist only on Linux.
        run: cyrius build --agnos src/main.cyr build/cmdrs-agnos

      - name: Render budget gate (≤ 5 ms)
        # `cyrius bench` runs the full bench suite; the gate script greps for the
        # `render_prompt` line, normalises its avg to µs, and fails CI if it exceeds
        # 5000 µs (architecture/001-prompt-render-budget.md). This is an in-process
        # figure with no exec in it, so it says nothing about cold start: smoke.sh
        # measures that. Override with `BUDGET_US` for a local run.
        # `set -o pipefail` (audit A-13): GitHub's default shell is `bash -e`, NOT
        # pipefail, so the pipeline's status would be bench-gate's alone, and a
        # `cyrius bench` that emitted a valid line and THEN died would read green.
        run: |
          set -o pipefail
          CYRIUS_DCE=1 cyrius bench tests/commandress.bcyr | scripts/bench-gate.sh
